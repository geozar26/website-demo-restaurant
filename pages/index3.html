
<div class="contact-top-row">

    <!-- CONTACT FORM -->
    <div class="contact-form-card" data-aos="zoom-in">

        <h2>Στείλε μήνυμα</h2>

        <form>

            <div class="form-group-row">

                <input
                    type="text"
                    name="name"
                    placeholder="Όνομα"
                    aria-label="Όνομα"
                    required>

                <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    aria-label="Email"
                    required>

            </div>

            <input
                type="text"
                name="subject"
                placeholder="Θέμα"
                aria-label="Θέμα">

            <textarea
                name="message"
                rows="4"
                placeholder="Μήνυμα..."
                aria-label="Μήνυμα"
                required></textarea>

            <button type="submit">Αποστολή</button>

        </form>

    </div>


    <!-- CONTACT DETAILS -->
    <div class="contact-blue-card" data-aos="zoom-in">

        <div class="card-top">

            <h3>
                <i class="fa-regular fa-clock"></i>
                Ωράριο Λειτουργίας
            </h3>

            <div class="hours-list">

                <div class="hours-row">
                    <span>Δευτέρα - Παρασκευή</span>
                    <strong>13:00 - 23:00</strong>
                </div>

                <div class="hours-row">
                    <span>Σάββατο - Κυριακή</span>
                    <strong>12:00 - 00:00</strong>
                </div>

            </div>

        </div>


        <div class="card-divider"></div>


        <div class="card-bottom">

            <h3>
                <i class="fa-solid fa-phone"></i>
                Επικοινωνία
            </h3>

            <p>
                <i class="fa-solid fa-phone"></i>
                <a href="tel:1234567890">1234567890</a>
            </p>

            <p>
                <i class="fa-solid fa-envelope"></i>
                <a href="mailto:info@kitchengrid.gr">
                    info@kitchengrid.gr
                </a>
            </p>

        </div>


        <div class="card-divider"></div>


        <div class="contact-address">

            <h3>
                <i class="fa-solid fa-location-dot"></i>
                Διεύθυνση
            </h3>

            <p>
                Πανεπιστημίου 42, Αθήνα
            </p>

        </div>

    </div>

</div>
